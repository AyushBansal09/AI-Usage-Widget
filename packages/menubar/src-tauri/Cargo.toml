[package]
name = "ai-usage-widget-menubar"
version = "0.0.1"
description = "Menu bar widget for ai-usage-widget"
authors = ["Ayush Bansal"]
license = "MIT"
edition = "2021"

[lib]
name = "ai_usage_widget_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
